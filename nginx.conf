user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Security: Disable nginx version disclosure (Mitigates Banner Grabbing)
    server_tokens off;

    # Security: Rate limiting to prevent Brute Force attacks
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=1r/s;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    include /etc/nginx/conf.d/*.conf;

    server {
        listen       443 ssl;
        server_name  example.com; # Sanitized domain placeholder

        # SSL Configuration Placeholders
        # ssl_certificate "/etc/nginx/ssl/cert.pem";
        # ssl_certificate_key "/etc/nginx/ssl/key.pem";

        # Security Headers (Hardening Layer)
        add_header X-Frame-Options "SAMEORIGIN" always;                     # Fixes Clickjacking
        add_header X-Content-Type-Options "nosniff" always;                 # Fixes MIME Sniffing
        add_header X-XSS-Protection "1; mode=block" always;                 # Anti-XSS Protection
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; # Fixes HSTS
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';" always; # Fixes CSP
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;     # Fixes CORS

        location / {
            proxy_pass http://127.0.0.1:3000; # Local upstream placeholder
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Security: Protect session cookies from hijacking and XSS
            proxy_cookie_path / "/; HTTPOnly; Secure";
        }

        # Apply rate limiting zone to the login endpoint to mitigate Brute Force
        location /login {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass http://127.0.0.1:3000;
        }

        # Security: Prevent Information Disclosure on custom error codes
        error_page 400 401 402 403 404 /40x.html;
        location = /40x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
